## OpenSSL Configure targets for the llvm-mingw arches upstream has no config
## for. build-openssl.sh copies this into openssl/Configurations/, where every
## *.conf is merged, so both inherit "mingw-common" from 10-main.conf.
##
## No asm_arch/perlasm_scheme, so both build pure C: OpenSSL ships no 32-bit ARM
## Windows perlasm, and the aarch64 asm is invalid for arm64ec. No uplink_arch
## either (Applink is MSVC interop). cflags is empty by design -- no -m32/-m64
## to pass, the llvm-mingw wrapper already carries the target.

my %targets = (
    "mingw-armv7" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW32",
        bn_ops           => add("BN_LLONG"),
        multilib         => "",
    },
    "mingw-arm64ec" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        multilib         => "",
    },
);
