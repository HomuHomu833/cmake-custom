## Extra OpenSSL Configure targets for the llvm-mingw arches that upstream
## does not ship a config for. Copied into openssl/Configurations/ by
## build-openssl.sh; OpenSSL merges every Configurations/*.conf, so these
## inherit the stock "mingw-common" template from 10-main.conf.
##
## Neither sets asm_arch/perlasm_scheme, so both build the pure-C bignum and
## crypto paths: OpenSSL has no 32-bit ARM Windows perlasm at all, and the
## aarch64 asm is not valid for arm64ec (an x64-compatible ABI). Nor do they
## set uplink_arch -- Applink is a MSVC-interop feature we do not use.
##
## cflags is deliberately empty: unlike the stock mingw/mingw64 targets there
## is no -m32/-m64 to pass, the llvm-mingw wrapper already carries the target.

my %targets = (
    "mingw-armv7" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW32",
        bn_ops           => add("BN_LLONG"),
        multilib         => "",
    },
    "mingw-arm64ec" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        multilib         => "",
    },
);
