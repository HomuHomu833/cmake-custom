## darwin64-arm64e: OpenSSL has no arm64e target, and darwin64-arm64 hardcodes
## cflags "-arch arm64", which overrides the arm64e osxcross wrapper and yields
## an arm64 libcrypto that will not link into an arm64e cmake. Mirrors
## darwin64-arm64 from 10-main.conf with the one flag changed; inheriting from
## it instead would leave both -arch flags on the command line.

my %targets = (
    "darwin64-arm64e" => {
        inherit_from     => [ "darwin-common" ],
        CFLAGS           => add("-Wall"),
        cflags           => add("-arch arm64e"),
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
);
